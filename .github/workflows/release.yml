name: Release

# A pushed tag `vX.Y.Z` cuts a versioned, immutable release:
#   1. guard — the tag must match Cargo.toml's version (no drift, fail fast);
#   2. the full CI suite runs against the tagged commit (workflow_call);
#   3. the runtime image is pushed to GHCR as `:vX.Y.Z` (immutable identity +
#      rollback handle) AND `:latest` (what deploy/docker-compose.yml pulls).
#
# Releases are the ONLY thing that publishes an image. Master pushes publish
# nothing, so a merge is never a deploy — cutting a tag is (gianna's rule,
# DESIGN.md §5: "No auto-update; versioned releases, immutable tags").
#
# Roll back by retagging, never by rebuilding:
#   docker buildx imagetools create -t ghcr.io/dcprevere/opsclaw:latest \
#                                      ghcr.io/dcprevere/opsclaw:vX.Y.Z
#
# ONE-TIME MANUAL STEP after the first successful run: GHCR creates the
# package PRIVATE regardless of repo visibility. Set it to Public at
# github.com/users/DCPRevere/packages/container/opsclaw/settings, or every
# `docker compose up` fails with `denied` for everyone but you.
#
# amd64 only for now. arm64 (Graviton, Apple Silicon) needs a second native
# job on `ubuntu-24.04-arm` plus a manifest-merge job — QEMU emulation is not
# a shortcut here, it makes a Rust release build take hours. Adding it later
# does not break any tag already published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  # Some actions (e.g. Swatinem/rust-cache@v2) still default to the deprecated
  # Node 20 runtime; opt into Node 24 ahead of the 2026-06-16 forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Cheapest possible check first: a tag that disagrees with Cargo.toml means
  # the published image would lie about its own version. Fail before spending
  # 30 minutes on the test suite.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Tag must match Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag != Cargo.toml version $crate — bump Cargo.toml first"
            exit 1
          fi

      # The chart's appVersion IS the image tag a default `helm install`
      # pulls (_helpers.tpl falls back to it when image.tag is empty). If it
      # drifts from what this run publishes, every default install dies in
      # ImagePullBackOff — and only in-cluster users would ever find out.
      - name: Helm appVersion must match the tag
        run: |
          app="$(grep -m1 '^appVersion' deploy/helm/Chart.yaml | sed 's/.*"\(.*\)"/\1/')"
          if [ "$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Chart.yaml appVersion $app != tag $GITHUB_REF_NAME — bump deploy/helm/Chart.yaml first"
            exit 1
          fi

  # An image nobody tested is not a release. This is the same suite master
  # runs (clippy -D warnings, cargo test, cargo deny, migration immutability).
  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action lowercases the image name for us — GHCR rejects
      # uppercase paths, and this repo's owner is spelled "DCPRevere".
      - name: Image metadata (version tag + latest)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # context: . because deploy/Dockerfile builds from the REPO ROOT (it
      # copies Cargo.toml, src/ and migrations/); the dockerfile just lives
      # one level down.
      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # .dockerignore excludes .git, so build.rs cannot read the commit and
          # every image would stamp itself "nogit". Pass it in explicitly.
          build-args: |
            OPSCLAW_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
