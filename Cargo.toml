[package]
name = "opsclaw"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "OpsClaw — an autonomous SRE agent"
authors = ["D C P Revere <dcprevere@gmail.com>"]
publish = false

# The `opsclaw` daemon and the `opsclaw-cli` operator CLI are separate binaries
# that both link the library crate; the CLI drives the same orchestrator path
# every channel uses (gianna pattern — no duplicated core logic).
[[bin]]
name = "opsclaw"
path = "src/main.rs"

[[bin]]
name = "opsclaw-cli"
path = "src/bin/cli/main.rs"

# Dependencies are pre-declared for all build waves so parallel worktree agents
# never need to edit this file (Cargo.toml is the merge-conflict hotspot).
[dependencies]
# Runtime & web
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
futures = "0.3"
async-stream = "0.3"
tower-http = { version = "0.7", features = ["trace", "cors", "fs", "compression-gzip", "set-header"] }

# Database (no ORM — sqlx with runtime-checked SQL so the crate builds with no live DB)
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "uuid",
    "json",
    "macros",
    "migrate",
] }

# HTTP client (LLM providers, Hindsight, Telegram, endpoint tools)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "form", "query", "cookies"] }
url = "2"
html2text = "0.17"

# Cron scheduling (timezone-aware next-run)
croner = "3"
chrono-tz = { version = "0.10", features = ["serde"] }

# Serialisation, config & time
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Auth & crypto (operator accounts, tokens, secret store, audit hash chain)
argon2 = "0.5"
rpassword = "7"
sha2 = "0.11"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
aes-gcm = "0.11"
rand = "0.10"
base64 = "0.22"

# Web push (PWA notifications)
web-push-native = "0.4.0"

# Errors, logging, async traits
regex = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[dev-dependencies]
# Local mock HTTP server for provider/Hindsight/endpoint-tool tests (no real network).
wiremock = "0.6"
tempfile = "3"
# test-util: paused-clock scheduler tests (start_paused, time::advance).
tokio = { version = "1", features = ["full", "test-util"] }
