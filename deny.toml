# cargo-deny configuration — supply-chain, licence, and advisory checks.
# Run with: cargo deny check   (or: just deny)

[graph]
all-features = true

[advisories]
version = 2
# `rsa` arrives transitively (jsonwebtoken, web-push-native); no RSA code path
# is used and no upstream fix is available yet. Tracked in docs/plans.
#
# RUSTSEC-2026-0387: timing leaks in `crypto-bigint` 0.5, reached through
# `p256` 0.13 (jsonwebtoken, web-push-native). Sessions use HS256, so JWTs never
# touch it. Web push does: VAPID ES256 signing uses the private key. Exploiting
# it needs precise timing of many signatures, and OpsClaw only signs when it
# sends a notification. The worst case is forged push notifications to
# subscribed browsers. The fix needs `p256` 0.14 in both crates. Accepted
# 2026-11-04; remove once they upgrade.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387"]

[licenses]
version = 2
# Licences we allow for third-party dependencies. OpsClaw itself is
# proprietary for now (DESIGN.md §7.15 — no LICENSE file until a deliberate
# decision) and is exempted below via `private`.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",                  # BSD Zero Clause (OSI; public-domain-equivalent)
    "CDLA-Permissive-2.0",   # Mozilla CA-bundle data crates (webpki-roots) via reqwest/rustls
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

# Don't fail on our own unpublished, proprietary crate.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"
# Crates we never want pulled in.
deny = [
    { name = "openssl" },        # we use rustls everywhere (reqwest: rustls feature)
    { name = "openssl-sys" },
]
allow = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The unpublished dcpr-ai-rs crates (Cargo.toml [patch.crates-io]). Remove
# with that patch once dcpr-llm and dcpr-agent are on crates.io.
allow-git = ["https://github.com/DCPRevere/dcpr-ai-rs"]
