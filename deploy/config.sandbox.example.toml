# OpsClaw against the remundo SANDBOX cluster, daemon running locally.
# Copy to ~/.opsclaw/config.toml and fill the store-backed secrets first:
#
#   openssl rand -base64 48 | opsclaw-cli secret set jwt-secret
#   printf '%s' "$HOME/.opsclaw/sandbox-kubeconfig.yaml" | opsclaw-cli secret set sandbox-kubeconfig
#   kubectl -n logs get secret coresearch-es-elastic-user \
#     -o jsonpath='{.data.elastic}' | base64 -d | opsclaw-cli secret set es-password
#
# OPENROUTER_API_KEY comes from the environment (systemd unit / shell).
# The ES resource expects a port-forward on localhost:9201 (see
# docs/SANDBOX.md step 4).

[daemon]
listen = "127.0.0.1:8484"
db_path = "/home/ae/.opsclaw/opsclaw.sqlite3"
tick_seconds = 300

[http]
jwt_secret = "store:jwt-secret"
# Plain http on localhost — the browser won't send a Secure cookie.
cookies_secure = false

# Who proves an operator is who they say they are AT LOGIN. Omitting the
# whole section means provider = "local": argon2 password + the daemon's own
# HS256 session cookie. The cookie, `token_version` revocation and the `ops_`
# CLI bearer are identical under both providers — only the front door moves.
#   [auth]
#   provider = "local"
#
# The hanko provider replaces the password form with a passkey widget and
# verifies each sign-in against the Hanko API server-side. It needs TLS on
# this daemon (WebAuthn only runs in a secure context, so it cannot work on
# the plain-http sandbox listener above) and operator rows already linked to
# Hanko user ids (`opsclaw-cli account create --hanko-subject <id>`).
#   [auth]
#   provider = "hanko"
#   # Hanko Cloud, or a self-hosted backend's PUBLIC port (8000), never the
#   # admin port (8001). Must be https:// outside fakes mode.
#   api_url = "https://<tenant>.hanko.io"
#   # The `aud` a session token must carry. Not inferable — see below.
#   audience = ["opsclaw.example.com"]
#
# HANKO-SIDE SETTINGS. Each of these fails silently or confusingly, so set
# them deliberately on the Hanko project/config before flipping the provider:
#
#   cors.allow_origins — must contain this daemon's origin, or the browser
#     widget's calls are blocked with nothing useful in the daemon log. This
#     key is TOP-LEVEL on Hanko backend v3.x; on v2.x it was
#     server.public.cors.allow_origins. Pin the image tag so a silent
#     rename cannot arrive with a rebuild.
#   webauthn.relying_party.id — the bare effective DOMAIN, no scheme and no
#     port ("opsclaw.example.com"). ONE-WAY DOOR: passkeys are
#     cryptographically bound to it, so changing it later orphans every
#     enrolled passkey and every operator must re-enrol. Pick the domain you
#     intend to keep.
#   webauthn.relying_party.origins — full origins WITH protocol
#     ("https://opsclaw.example.com"), unlike the id above.
#   session.audience — must match auth.audience in this file. Hanko defaults
#     it to webauthn.relying_party.id, which is a different string from the
#     origin, so this is the easiest one to get wrong.
#   session.enable_auth_token_header = true — REQUIRED when the Hanko API is
#     on a different domain from opsclaw. The widget reads its session token
#     from sessionStorage, which is only populated from the X-Auth-Token
#     response header this flag enables; without it sign-in completes at
#     Hanko and then stalls here with no token to exchange.

[llm]
api_key = "env:OPENROUTER_API_KEY"
models = ["deepseek/deepseek-v4-pro"]

[memory]
hindsight_url = "http://localhost:8888"

[limits]
max_actions_per_hour = 30
# $5/day hard stop — enforced by the CostGuard; loud notice when reached.
max_cost_per_day_cents = 500

# Policy bounds (all optional; empty lists change nothing). Entries match
# as "<tool>", "<tool>:<substring>", or "runbook:<title>".
#   [policy]
#   always_ask = ["kubernetes:delete"]     # force approval even at auto
#   auto_approve = ["systemd:systemctl start nginx"]  # Medium-risk only
#   command_allowlist = []                 # non-empty => only listed mutations run
#   forbidden_paths = ["/etc/shadow"]      # hard-blocked at every level

# Escalation contact chain: who gets paged when an incident opens, and how
# it walks unacknowledged. With no steps declared, opsclaw broadcasts on
# every channel (60m ack window, 20m re-notify) — this explicit single step
# does the same for the web-UI-only sandbox setup; add a telegram step
# first once a bot is configured, e.g. contact = "telegram".
[[escalation.step]]
contact = "*"              # "*" = every channel; or a channel name
ack_timeout_minutes = 60   # unacked this long -> next step (or expire)
repeat_interval_minutes = 20

[[project]]
name = "remundo"
autonomy = "suggest"

# Per-project escalation override: a project that declares its own
# [[project.escalation.step]] chain routes ITS incidents there instead of
# the global [[escalation.step]] chain above (projects without one inherit
# the global chain; with neither declared, opsclaw broadcasts on every
# channel). Declaring [project.escalation] with no steps is refused at
# boot — remove the table entirely to inherit.
#   [[project.escalation.step]]
#   contact = "telegram"       # page the remundo on-call bot first
#   ack_timeout_minutes = 30
#   repeat_interval_minutes = 10
#   [[project.escalation.step]]
#   contact = "*"              # then everyone, everywhere
#   ack_timeout_minutes = 60
#   repeat_interval_minutes = 20

[[project.env]]
name = "sandbox"
# Pinned to observe for the first soak: the agent reads, notifies, and
# dry-run-logs what it WOULD do. Promote to suggest after reviewing
# `opsclaw-cli dry-run-log`.
autonomy = "observe"
expected_state = "running"

[[project.env.target]]
name = "cluster"
kind = "kubernetes"
# Value = PATH to the generated SA kubeconfig (deploy/gen-opsclaw-kubeconfig.sh).
credential = "store:sandbox-kubeconfig"
# Context name inside that kubeconfig.
address = "opsclaw-sandbox"

[[project.env.target.resource]]
type = "elasticsearch"
name = "logs"
url = "https://localhost:9201"
username = "elastic"
credential = "store:es-password"
# The ECK cert's SANs are the in-cluster DNS names; through a localhost
# port-forward the hostname can never match, so verification is disabled
# for THIS resource only (loudly warned at boot). The hop is
# localhost-to-localhost; the tunnel itself is TLS to the apiserver.
insecure_tls = true

[[project.env.target.resource]]
# kube-prometheus-stack's Prometheus (metrics for every workload +
# kube-state-metrics + node exporters). Plain HTTP in-cluster, no auth —
# reached through the same port-forward mechanism as ES.
type = "prometheus"
name = "metrics"
url = "http://localhost:9202"
