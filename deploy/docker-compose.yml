# OpsClaw standard install (DESIGN.md §5): the opsclaw image plus a PINNED
# Hindsight image — memory is a core promise, not an optional add-on, so live
# mode refuses to boot without HINDSIGHT_URL (src/config/mod.rs validate()).
#
# Usage (from the repo root):
#   cp deploy/.env.example deploy/.env   # fill in secrets/model config
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# No checkout needed — both files are self-contained:
#   curl -O https://raw.githubusercontent.com/DCPRevere/opsclaw/master/deploy/docker-compose.yml
#   curl -o .env https://raw.githubusercontent.com/DCPRevere/opsclaw/master/deploy/.env.example
#   mkdir -p creds
#   $EDITOR .env
#
# ONBOARD FIRST, THEN START. This order is not a preference:
#
#   docker compose --env-file .env run --rm --no-deps opsclaw-daemon \
#       opsclaw-cli onboard --hindsight-url http://opsclaw-hindsight:8888
#   docker compose --env-file .env up -d
#   docker compose exec opsclaw-daemon opsclaw-cli doctor
#
# Onboarding can end with NO targets, and on a containerised install that is
# usually right: a target's credential is opened by the daemon, so it has to
# be mounted into this container first (see the daemon's `volumes:` below).
# Add targets with `opsclaw-cli config project add` once the mount exists.
# The one target kind needing no credential, `local`, means THIS CONTAINER —
# not the host — so it reports the container's own tooling, which is nearly
# none.
#
# Hindsight takes ~40s to load its models. `doctor` run before that reports
# `[FAIL] hindsight: ... reachable` — wait and re-run rather than debugging
# it. The daemon itself starts and stays healthy throughout; it does not
# require memory to be up at boot.
#
# This compose file always sets HINDSIGHT_URL, so the daemon is always in
# live mode, and live mode refuses to start without http.jwt_secret (an unset
# one falls back to a constant published in the source, letting anyone forge
# an operator session). `onboard` is what generates that secret. On a fresh
# volume there is no config.toml, so `up` crash-loops — and you cannot
# `exec` into a restarting container to fix it. `run` sidesteps that: it
# starts a one-off container with a different command, writes config.toml
# onto the same opsclaw_home volume, and exits.
#
# Drop --no-deps if you want Hindsight up while you onboard; onboard itself
# does not contact it.
#
# A bare-binary install (`cargo install` / a prebuilt release) is also
# supported but must point HINDSIGHT_URL at an existing Hindsight instance —
# this compose file is what stands one up for you.
#
# Every container is named opsclaw-<role> so `docker ps` makes each one's
# purpose obvious, mirroring gianna's convention (~/src/dcprevere/gianna.chat).

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Copies host-provided target credentials into a daemon-owned volume and
  # fixes ownership/modes before each start. The source files stay untouched.
  opsclaw-credentials:
    image: ghcr.io/dcprevere/opsclaw:${OPSCLAW_VERSION:-latest}
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        find /output -mindepth 1 -delete &&
        cp -a /input/. /output/ &&
        chown -R 10001:10001 /output &&
        find /output -type d -exec chmod 700 {} \; &&
        find /output -type f -exec chmod 600 {} \;
    volumes:
      - ./creds:/input:ro
      - opsclaw_credentials:/output

  # Hindsight: the sole memory backend (DESIGN.md §3 Memory — "live mode
  # refuses to boot without it"). PINNED: gianna's lockstep-pinning rule —
  # never bump this casually; a version bump is a deliberate, tested decision,
  # not a side effect of `docker compose pull`. Needs an LLM for its internal
  # retain/reflect extraction — set the HINDSIGHT_LLM_* vars below.
  opsclaw-hindsight:
    container_name: opsclaw-hindsight
    # 1.2.0: verified 2026-11-04 with tests/hindsight_live.rs (every call the
    # daemon makes) against OpenAI gpt-6.1-sol. 0.8.3 fails fact extraction
    # on current OpenAI models (it sends `max_tokens`). Existing 0.8.x data
    # is migrated in place by Hindsight's own migrations on first start.
    image: ghcr.io/vectorize-io/hindsight:1.2.0
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:?set HINDSIGHT_LLM_PROVIDER in .env (e.g. openai)}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:?set HINDSIGHT_LLM_MODEL in .env}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_LLM_BASE_URL:?set HINDSIGHT_LLM_BASE_URL in .env}
      # `:?` like its three neighbours, because Hindsight treats it the same
      # way: MemoryEngine.__init__ raises "LLM API key is required" and the
      # container crash-loops. Left optional, the only symptom was an opsclaw
      # `doctor` FAIL on an unreachable Hindsight — the real cause buried in a
      # DIFFERENT container's logs. Fail here instead, before anything starts.
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:?set HINDSIGHT_LLM_API_KEY in .env — Hindsight refuses to start without one}
      # Language for every memory Hindsight writes. Without it, small models
      # (gpt-6-luna, seen 2026-11-04) can write facts in another language.
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: ${HINDSIGHT_LLM_OUTPUT_LANGUAGE:-English}
    volumes:
      - opsclaw_hindsight:/home/hindsight/.pg0
    # Not exposed to the host network; only opsclaw-daemon talks to it, over
    # the compose-internal network at http://opsclaw-hindsight:8888.

  opsclaw-daemon:
    container_name: opsclaw-daemon
    # Published by .github/workflows/release.yml on every `vX.Y.Z` tag. Pin
    # OPSCLAW_VERSION to an immutable version tag in production (`latest`
    # moves under you on the next release, which is a deploy you did not
    # choose — DESIGN.md §5: "No auto-update; versioned releases, immutable
    # tags").
    #
    # There is deliberately no `build:` here: this file must work for someone
    # who downloaded IT ALONE and never cloned the repo. To build your own
    # instead, from a repo checkout:
    #   docker build -f deploy/Dockerfile -t ghcr.io/dcprevere/opsclaw:latest .
    image: ghcr.io/dcprevere/opsclaw:${OPSCLAW_VERSION:-latest}
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      opsclaw-hindsight:
        condition: service_started
      opsclaw-credentials:
        condition: service_completed_successfully
    # Graceful shutdown drains HTTP then gives background work a bounded
    # (~20s) budget (DESIGN.md §3 HTTP gateway); give docker's default
    # SIGTERM→SIGKILL grace enough headroom that a stop never cuts the drain
    # short (systemd's TimeoutStopSec must exceed this same budget for a
    # bare-binary install — DESIGN.md §5).
    stop_grace_period: 30s
    environment:
      OPSCLAW_LISTEN: 0.0.0.0:8484
      # LLM: shipped default is OpenRouter only (DESIGN.md §7 decision 13) —
      # one provider, server-side ordered model fallback.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # OpenAI directly: referenced from config.toml as env:OPENAI_API_KEY
      # (see .env.example). Unused unless the config points at it.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPSCLAW_MODELS: ${OPSCLAW_MODELS:-}
      # Memory: Hindsight is the SOLE backend. Unset HINDSIGHT_URL to run
      # fully faked (no live memory) — there is no in-process fallback.
      HINDSIGHT_URL: ${HINDSIGHT_URL:-http://opsclaw-hindsight:8888}
      HINDSIGHT_TOKEN: ${HINDSIGHT_TOKEN:-}
      # Read-only billing credentials let OpsClaw include Hindsight's
      # OpenRouter usage in the same daily cap and `usage` report.
      HINDSIGHT_LLM_BASE_URL: ${HINDSIGHT_LLM_BASE_URL:-}
      HINDSIGHT_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:-}
      # Telegram channel (optional).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # External dead-man heartbeat (DESIGN.md §4): standard feature in every
      # placement, not mandatory outside in-cluster installs — but strongly
      # recommended even here, since it's the one signal that survives the
      # whole daemon dying. Point it at healthchecks.io, a PagerDuty
      # heartbeat, or any webhook outside this host's own failure domain.
      OPSCLAW_DEADMAN_URL: ${OPSCLAW_DEADMAN_URL:-}
      RUST_LOG: ${RUST_LOG:-opsclaw=info,tower_http=info}
      # Minutes between the seeded per-target scans (default 30). Blank keeps
      # the default. Longer intervals cut LLM spend roughly in proportion.
      OPSCLAW_SCAN_INTERVAL_MINUTES: ${OPSCLAW_SCAN_INTERVAL_MINUTES:-}
    volumes:
      # Config (~/.opsclaw/config.toml inside the container) and the SQLite
      # store both live on this named volume so they survive a container
      # recreate. `opsclaw onboard` (run via `docker compose exec
      # opsclaw-daemon opsclaw-cli onboard`) writes config.toml here on first
      # setup.
      - opsclaw_home:/home/opsclaw/.opsclaw
      # Put target credentials in ./creds and reference them in config as
      # /home/opsclaw/creds/<name>. The init service above copies them into
      # this private volume and applies uid 10001 plus ssh-safe modes.
      - opsclaw_credentials:/home/opsclaw/creds:ro
      #
      # On a shared host, `docker inspect` shows every mount to anyone in the
      # docker group — which is root-equivalent anyway. Scope these
      # credentials to what this daemon is meant to reach, and prefer keys
      # issued to it alone so they can be revoked without touching yours.
    ports:
      # Bind to localhost only, same as gianna: front this with a
      # reverse proxy (Caddy/nginx) for TLS, or reach it via VPN/tailnet/SSH
      # tunnel per DESIGN.md §4's placement guidance — the web UI is "never
      # publicly reachable" by design.
      - "127.0.0.1:8484:8484"

volumes:
  opsclaw_hindsight:
  opsclaw_home:
  opsclaw_credentials:
