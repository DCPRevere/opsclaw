# OpsClaw standard install (DESIGN.md §5): the opsclaw image plus a PINNED
# Hindsight image — memory is a core promise, not an optional add-on, so live
# mode refuses to boot without HINDSIGHT_URL (src/config/mod.rs validate()).
#
# Usage (from the repo root):
#   cp deploy/.env.example deploy/.env   # fill in secrets/model config
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# A bare-binary install (`cargo install` / a prebuilt release) is also
# supported but must point HINDSIGHT_URL at an existing Hindsight instance —
# this compose file is what stands one up for you.
#
# Every container is named opsclaw-<role> so `docker ps` makes each one's
# purpose obvious, mirroring gianna's convention (~/src/dcprevere/gianna.chat).

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Hindsight: the sole memory backend (DESIGN.md §3 Memory — "live mode
  # refuses to boot without it"). PINNED: gianna's lockstep-pinning rule —
  # never bump this casually; a version bump is a deliberate, tested decision,
  # not a side effect of `docker compose pull`. Needs an LLM for its internal
  # retain/reflect extraction — set the HINDSIGHT_LLM_* vars below.
  opsclaw-hindsight:
    container_name: opsclaw-hindsight
    image: ghcr.io/vectorize-io/hindsight:0.8.3
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:?set HINDSIGHT_LLM_PROVIDER in .env (e.g. openai)}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:?set HINDSIGHT_LLM_MODEL in .env}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_LLM_BASE_URL:?set HINDSIGHT_LLM_BASE_URL in .env}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:-}
    volumes:
      - opsclaw_hindsight:/home/hindsight/.pg0
    # Not exposed to the host network; only opsclaw-daemon talks to it, over
    # the compose-internal network at http://opsclaw-hindsight:8888.

  opsclaw-daemon:
    container_name: opsclaw-daemon
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      - opsclaw-hindsight
    # Graceful shutdown drains HTTP then gives background work a bounded
    # (~20s) budget (DESIGN.md §3 HTTP gateway); give docker's default
    # SIGTERM→SIGKILL grace enough headroom that a stop never cuts the drain
    # short (systemd's TimeoutStopSec must exceed this same budget for a
    # bare-binary install — DESIGN.md §5).
    stop_grace_period: 30s
    environment:
      OPSCLAW_LISTEN: 0.0.0.0:8484
      # LLM: shipped default is OpenRouter only (DESIGN.md §7 decision 13) —
      # one provider, server-side ordered model fallback.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPSCLAW_MODELS: ${OPSCLAW_MODELS:-}
      # Memory: Hindsight is the SOLE backend. Unset HINDSIGHT_URL to run
      # fully faked (no live memory) — there is no in-process fallback.
      HINDSIGHT_URL: ${HINDSIGHT_URL:-http://opsclaw-hindsight:8888}
      HINDSIGHT_TOKEN: ${HINDSIGHT_TOKEN:-}
      # Telegram channel (optional).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # External dead-man heartbeat (DESIGN.md §4): standard feature in every
      # placement, not mandatory outside in-cluster installs — but strongly
      # recommended even here, since it's the one signal that survives the
      # whole daemon dying. Point it at healthchecks.io, a PagerDuty
      # heartbeat, or any webhook outside this host's own failure domain.
      OPSCLAW_DEADMAN_URL: ${OPSCLAW_DEADMAN_URL:-}
      RUST_LOG: ${RUST_LOG:-opsclaw=info,tower_http=info}
    volumes:
      # Config (~/.opsclaw/config.toml inside the container) and the SQLite
      # store both live on this named volume so they survive a container
      # recreate. `opsclaw onboard` (run via `docker compose exec
      # opsclaw-daemon opsclaw-cli onboard`) writes config.toml here on first
      # setup.
      - opsclaw_home:/home/opsclaw/.opsclaw
    ports:
      # Bind to localhost only, same as gianna: front this with a
      # reverse proxy (Caddy/nginx) for TLS, or reach it via VPN/tailnet/SSH
      # tunnel per DESIGN.md §4's placement guidance — the web UI is "never
      # publicly reachable" by design.
      - "127.0.0.1:8484:8484"

volumes:
  opsclaw_hindsight:
  opsclaw_home:
