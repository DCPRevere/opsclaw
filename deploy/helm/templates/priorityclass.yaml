{{- if .Values.priorityClassName.create }}
# DESIGN.md §5: "priority class + PodDisruptionBudget so opsclaw is among the
# last pods evicted." Below system-cluster-critical (2000000000) and
# system-node-critical (2000001000) — opsclaw is important, not a cluster
# system component — but above the implicit default (0) so ordinary
# workloads are evicted under node pressure before it is.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "opsclaw.priorityClassName" . }}
  labels:
    {{- include "opsclaw.labels" . | nindent 4 }}
value: {{ .Values.priorityClassName.value }}
globalDefault: false
description: >-
  Keeps the opsclaw daemon among the last pods evicted under node pressure —
  it needs to stay alive to report the pressure it's watching for.
{{- end }}
