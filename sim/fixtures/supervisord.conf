; sim/fixtures/supervisord.conf — process supervisor config for the sim
; target image. Stands in for systemd (no cgroup/dbus inside a gVisor
; sandbox): sshd plus two fake long-running services scenarios can stop,
; flap, or starve. Installed at /etc/supervisor/conf.d/opsclaw-sim.conf.

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/var/log/opsclaw-sim/sshd.log
stderr_logfile=/var/log/opsclaw-sim/sshd.log

[program:fake-worker]
; Stand-in for a remundo-style worker service (brief §9 "process flapping",
; DESIGN.md service-stopped/proc-flapping scenarios). service-stopped uses
; `supervisorctl stop fake-worker`; proc-flapping crashes it on a cadence
; from inside the script itself so supervisord's autorestart produces real
; restart churn, not a scripted illusion of it.
command=/opt/fake-services/fake-worker.sh
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/var/log/opsclaw-sim/fake-worker.log
stderr_logfile=/var/log/opsclaw-sim/fake-worker.log

[program:fake-web]
; A tiny TCP listener standing in for remundo's TinyHealthCheck pattern
; (REMUNDO.md "Scepticism facts": a healthy listener proves only the loop is
; alive, not downstream connectivity).
command=/opt/fake-services/fake-web.sh
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/var/log/opsclaw-sim/fake-web.log
stderr_logfile=/var/log/opsclaw-sim/fake-web.log

[program:log-emitter]
; Idle by default (emits one heartbeat line/10s); log-flood and
; logfile-growth scenarios crank its rate via a control file.
command=/opt/fake-services/log-emitter.sh
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/var/log/opsclaw-sim/log-emitter.log
stderr_logfile=/var/log/opsclaw-sim/log-emitter.log

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/opsclaw-sim/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
