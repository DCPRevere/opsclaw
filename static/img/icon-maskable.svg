<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Maskable icons need the safe zone (a centred 80% circle) fully
       covered by the background, since platform masks may crop the
       corners — the glyph below is scaled down and centred accordingly. -->
  <rect width="100" height="100" fill="#1a1d23"/>
  <circle cx="50" cy="45" r="15" fill="none" stroke="#4f8cff" stroke-width="5"/>
  <path d="M50 60 L50 72 M42 72 L58 72" stroke="#4f8cff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="45" cy="43" r="3" fill="#e6e8eb"/>
  <circle cx="55" cy="43" r="3" fill="#e6e8eb"/>
</svg>
